<div class="assistant" id="assistant" data-endpoint="{{ url_for('assistant.public_view') }}" data-csrf="" data-user="public" data-voice="0"
     data-intro="{{ _('Hello! I am Clubi. I can tell you what the club offers, how it works and whether it fits you. What would you like to know?') }}"
     data-thinking="{{ _('Clubi is thinking …') }}" data-failed="{{ _('Something went wrong. Please try again.') }}"
     data-sees="">
  <button type="button" class="assistant-toggle button" aria-expanded="false" aria-controls="assistant-panel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.7 1.8L21.5 17.5l-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg>
    {{ _("Ask Clubi") }}
  </button>
  <section class="assistant-panel" id="assistant-panel" hidden aria-label="{{ _('Personal assistant Clubi') }}">
    <header class="assistant-head">
      <span class="assistant-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></span>
      <div class="assistant-title">
        <strong>{{ _("Clubi") }}</strong>
        <p class="assistant-context"></p>
      </div>
      <button type="button" class="assistant-iconbtn assistant-clear" aria-label="{{ _('New conversation') }}" title="{{ _('New conversation') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button type="button" class="assistant-iconbtn assistant-close" aria-label="{{ _('Close') }}" title="{{ _('Close') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <p class="assistant-note">{{ _("Clubi is an AI and can make mistakes. It does not give legal or financial advice. Your questions are not stored.") }}</p>
    <div class="assistant-log" role="log" aria-live="polite"></div>
    <ul class="assistant-suggest" aria-label="{{ _('Suggested questions') }}">
      <li><button type="button" class="assistant-chip" data-q="{{ _('What does the club offer?') }}">{{ _("What does the club offer?") }}</button></li>
      <li><button type="button" class="assistant-chip" data-q="{{ _('How does verification work?') }}">{{ _("How does verification work?") }}</button></li>
      <li><button type="button" class="assistant-chip" data-q="{{ _('What will it cost?') }}">{{ _("What will it cost?") }}</button></li>
      <li><button type="button" class="assistant-chip" data-q="{{ _('Is my data safe?') }}">{{ _("Is my data safe?") }}</button></li>
    </ul>
    <form class="assistant-form">
      <label class="visually-hidden" for="assistant-input">{{ _("Your question") }}</label>
      <textarea id="assistant-input" rows="1" maxlength="1000" required placeholder="{{ _('Your question') }}"></textarea>
      <button type="submit" class="assistant-round assistant-send" aria-label="{{ _('Send') }}" title="{{ _('Send') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="assistant-cta">
      <a class="button" href="{{ url_for('auth.register') }}">{{ _("Become a member") }}</a>
      <a class="button button-secondary" href="{{ url_for('auth.login') }}">{{ _("Log in") }}</a>
    </div>
  </section>
</div>
