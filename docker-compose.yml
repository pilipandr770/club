name: club

# Наружу публикует только caddy (80/443). db и app — во внутренней сети.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Создаёт club_test для тестов; срабатывает только при пустом томе
      - ./deploy/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    # Тот же образ, что и app: одинаковые аргументы сборки, иначе они перезаписывают друг друга
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV:-0}
    image: club-app:local
    command: ["flask", "db", "upgrade"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://club:${POSTGRES_PASSWORD}@db:5432/club
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV:-0}
    image: club-app:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://club:${POSTGRES_PASSWORD}@db:5432/club
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/app/uploads
    networks:
      - default
      - laws_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Периодические задачи: закрытие аукционных лотов по времени и рассылка итогов (не cron на хосте)
  scheduler:
    image: club-app:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://club:${POSTGRES_PASSWORD}@db:5432/club
    command: ["sh", "-c", "while true; do flask close-auctions; sleep 30; done"]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    # Только локально: TLS и публичный вход делает Traefik на сервере
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy

networks:
  # Сеть внутреннего сервиса поиска по закону (laws-api). Локально: docker network create laws_net
  laws_net:
    external: true

volumes:
  pgdata:
  uploads:
  caddy_data:
